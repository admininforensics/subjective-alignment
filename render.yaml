databases:
  - name: subjective-alignment-db
    plan: free

services:
  - type: web
    name: subjective-alignment-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: sh -c "python manage.py migrate && python manage.py seed_default_assessment && python manage.py ensure_superuser && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: subjective-alignment-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

  - type: web
    name: subjective-alignment-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      # Ensure devDependencies are installed for build tooling (Tailwind/PostCSS).
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      # Set this to your backend public URL (must include /api), e.g.:
      # https://subjective-alignment-backend.onrender.com/api
      - key: NEXT_PUBLIC_API_URL
        value: "http://localhost:8000/api"
